[build]
target = "riscv64gc-unknown-none-elf"

# Linker script and relaxation flags come from build.rs (`cargo:rustc-link-arg`).
# Do not also pass `-Tlink.x` here: Cargo loads this file when building in `kernel/`,
# and a second `-Tlink.x` makes lld reject the duplicate `MEMORY { RAM ... }` region.
